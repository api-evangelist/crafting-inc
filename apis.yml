aid: crafting-inc
name: Crafting, Inc.
description: >-
  Crafting, Inc. (crafting.dev) is a Silicon Valley AI DevOps company building
  infrastructure for the agentic era. Its platform gives autonomous coding agents
  and engineers controlled, production-like access to real infrastructure,
  dependencies, credentials, tests, and validation inside secure, isolated
  "sandboxes" so they can run, test, validate, iterate, and ship autonomously
  with enterprise-grade guardrails across multiple clouds and regions. Crafting
  is consumed through the `cs` command-line tool, a Web Console, a Terraform
  provider, and a GitHub Action rather than a public REST API, and is used by
  engineering teams at Brex, Faire, Webflow, Lime, Verkada, Instabase, and
  Persona. Documentation is hosted at docs.sandboxes.cloud.
